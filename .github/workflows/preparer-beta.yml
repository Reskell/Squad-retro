# « Préparer la bêta » : télécharge les versions listées dans
# manifestes/sources.json, calcule leurs empreintes, publie les cores dans une
# version GitHub (adresse fixe), puis écrit manifestes/versions-beta.json.
# Seules les apps en canal bêta installent ces versions.
name: Préparer la bêta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['manifestes/sources.json']

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/preparer_beta.py
      - name: Publier les cores (miroir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls miroir/* > /dev/null 2>&1; then
            gh release create "$(cat etiquette.txt)" miroir/* --prerelease \
              --title "Composants $(cat etiquette.txt)" \
              --notes "Copies fixes des cores RetroArch pour SQUAD//RETRO (ne pas supprimer : les apps les téléchargent)."
          fi
      - run: |
          git config user.name "SQUAD//RETRO"
          git config user.email "actions@github.com"
          git add manifestes/versions-beta.json
          git commit -m "Bêta : nouvelles versions à tester" || echo "Rien de neuf."
          git push

  verifier:
    # Installe pour de vrai chaque composant sur Windows avec le moteur et
    # vérifie que chaque console est prête : une bêta cassée se voit ici,
    # pas chez quelqu'un.
    needs: beta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo run --release --example installer_beta -- manifestes/versions-beta.json
